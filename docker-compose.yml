services:
  uptime-kuma:
    hostname: uptime-kuma
    build: ./uptime-kuma
    container_name: uptime-kuma
    volumes:
      - /srv/uptime-kuma:/app/data
    environment:
      # Uptime Kuma v2 uses MariaDB instead of SQLite (fixes unbounded kuma.db growth).
      - UPTIME_KUMA_DB_TYPE=mariadb
      - UPTIME_KUMA_DB_HOSTNAME=mariadb
      - UPTIME_KUMA_DB_PORT=3306
      - UPTIME_KUMA_DB_NAME=${MARIADB_DATABASE}
      - UPTIME_KUMA_DB_USERNAME=${MARIADB_USER}
      - UPTIME_KUMA_DB_PASSWORD=${MARIADB_PASSWORD}
    restart: always
    labels:
      # Watched by the autoheal sidecar; uses the image's built-in HEALTHCHECK.
      - autoheal=true
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    container_name: mariadb
    command: ["--max-allowed-packet=256M"]
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - /srv/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_URL=${SERVER_URL}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/caddy-data:/data
      - /srv/caddy-config:/config
    restart: always
    depends_on:
      - uptime-kuma

  tor_proxy:
    container_name: tor_proxy
    build: ./tor_proxy/
    restart: unless-stopped
    volumes:
      - /srv/tor_data:/var/lib/tor
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9050"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "9050:9050"
      - "9051:9051"

  # Restarts any container reporting Docker health=unhealthy (label autoheal=true).
  # restart:always only reacts to process EXIT; a hung/dead app stays "Up (unhealthy)"
  # forever otherwise -- which is what caused the 2026-06 outage.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
