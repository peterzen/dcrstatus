version: '3.8'

services:
  uptime-kuma:
    hostname: uptime-kuma
    build: ./uptime-kuma
    container_name: uptime-kuma
    volumes:
      - uptime-kuma:/app/data
    restart: always

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      - SERVER_URL=${SERVER_URL}
    command: /bin/sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh; while :; do sleep 12h && nginx -s reload 2>/dev/null; done & nginx -g "daemon off;"'
    restart: always
    depends_on:
      - uptime-kuma

