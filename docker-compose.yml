# https://stackoverflow.com/questions/47088261/restarting-an-unhealthy-docker-container-based-on-healthcheck
  tor_proxy:
    container_name: tor_proxy
    build: ./tor_proxy/
    restart: unless-stopped
    volumes:
      - tor_data:/var/lib/tor
    healthcheck:
      test: curl --socks5-hostname localhost:9050 --silent --fail http://2gzyxa5ihm7nsggfxnu52rck2vv4rvmdlkiu3zzui5du4xyclen53wid.onion/
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "9050:9050"
      - "9051:9051"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Long-lived container: renews every 12h, certbot only acts if cert is near expiry
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: always

volumes:
  tor_data:
  certbot-webroot:
  certbot-certs:
  uptime-kuma:
    external: true

